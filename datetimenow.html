<!DOCTYPE html>
<html>
<head>
  <script type="text/javascript">
    function updateTime() {
      var date = new Date();
      var hours = (date.getHours() < 10 ? '0' : '') + date.getHours();
      var minutes = (date.getMinutes() < 10 ? '0' : '') + date.getMinutes();
      var seconds = (date.getSeconds() < 10 ? '0' : '') + date.getSeconds();
      var day = date.getDate();
      var monthOfYear = date.getMonth();
      var year = date.getFullYear();
      var dayOfWeek = date.getDay();

      var weekday = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var month = ["January", "February", "March", "April", "May", "June",
                   "July", "August", "September", "October", "November", "December"];

      var time = hours + ":" + minutes + ":" + seconds;
      var dateString = weekday[dayOfWeek] + ", " + day + " " + month[monthOfYear] + " " + year;

      document.getElementById('time').innerHTML = time;
      document.getElementById('date').innerHTML = dateString;

      setTimeout(updateTime, 1000);
    }

    window.addEventListener("load", updateTime);
  </script>
</head>
<body style="background-color: black">
  <div id="time" style="text-align: center; font-size: 10em; font-family: Arial; color: white;"></div>
  <div id="date" style="text-align: center; font-size: 3em; font-family: Arial; color: white;"></div>
</body>
</html>
